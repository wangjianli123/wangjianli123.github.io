<div class="pub-item">
  <div class="pub-thumb">
    <img src="{{ page.preview }}" alt="Thumbnail" onerror="this.style.display='none'">
  </div>
  <div class="pub-details">
    <div class="pub-title">{{ page.title }}</div>
    <div class="pub-authors">{{ page.authors | markdownify }}</div>
    <div class="pub-venue">{{ page.venue }}</div>
    <div class="pub-links">
      <a href="{{ page.official_url }}" target="_blank">📄 Publisher's Version</a>
      <a href="#" class="bibtex-toggle" data-target="bibtex-{{ page.slug }}">🧰 BibTeX</a>
      <div class="bibtex-content" id="bibtex-{{ page.slug }}" style="display:none;">
        <pre>{{ page.bibtex }}</pre>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll(".bibtex-toggle").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.preventDefault();
      var target = document.getElementById(btn.dataset.target);
      if(target.style.display === "none") { target.style.display = "block"; }
      else { target.style.display = "none"; }
    });
  });
});
</script>
